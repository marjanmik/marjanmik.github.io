<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#121726">
<title>Кубик — интеллектуальная игра</title>
<meta name="description" content="Викторина на кубике: отвечай на вопросы, зарабатывай повороты и собери кубик. 20 тем, 3000 вопросов, вызов другу.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Кубик">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="Кубик — интеллектуальная игра">
<meta property="og:description" content="Отвечай на вопросы, зарабатывай повороты и собери кубик. Прими вызов и попробуй обыграть друга.">
<meta property="og:image" content="https://marjanmik.github.io/kubik3/og.png?v=0.15.0">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Кубик: викторина, в которой надо собрать кубик">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Кубик — интеллектуальная игра">
<meta name="twitter:description" content="Отвечай на вопросы, зарабатывай повороты и собери кубик.">
<meta name="twitter:image" content="https://marjanmik.github.io/kubik3/og.png?v=0.15.0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кубик">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="style.css?v=0.15.0">
</head>
<body class="loading">
<div id="stage"></div>

<section id="scr-menu" class="scr">
  <div class="menu-head">
    <h1 class="logo">Кубик</h1>
    <p class="sub">интеллектуальная игра</p>
    <p class="best" id="m-best"></p>
  </div>
  <div class="cube-slot"></div>
  <div class="menu-btns">
    <button class="btn primary" id="m-continue" hidden></button>
    <button class="btn" id="m-chal" hidden></button>
    <button class="btn" id="m-day"></button>
    <button class="btn" id="m-new">Новая игра</button>
    <div class="mrow"><button class="btn ghost" id="m-my"></button><button class="btn ghost" id="m-ach"></button></div>
    <button class="btn ghost" id="m-help">Как играть</button>
    <div class="menu-foot">
      <button class="link" id="m-sound"></button>
      <button class="link" id="m-update"></button>
    </div>
    <div class="menu-links"><button class="link rep-menu" id="m-reports" hidden></button><button class="link duel-menu" id="m-duels" hidden></button><button class="link" id="m-tg" hidden></button></div>
  </div>
</section>

<section id="scr-levels" class="scr">
  <header class="bar"><button class="ibtn" data-go="menu" aria-label="Назад"></button><h2>Новая игра</h2><span class="ibtn"></span></header>
  <div class="scroll">
    <div class="sizes" id="lv-size"></div>
    <p class="lead" id="lv-lead"></p>
    <div id="lv-list"></div>
  </div>
</section>

<section id="scr-topics" class="scr">
  <header class="bar"><button class="ibtn" data-go="menu" aria-label="В меню"></button><h2 id="tp-title"></h2><span class="ibtn"></span></header>
  <div class="scroll">
    <p class="lead" id="tp-lead"></p>
    <div id="tp-list"></div>
  </div>
  <div class="foot two">
    <button class="btn ghost" id="tp-rand"></button>
    <button class="btn primary" id="tp-go">Начать уровень</button>
  </div>
</section>

<section id="scr-game" class="scr">
  <header class="bar"><button class="ibtn" id="g-home" aria-label="В меню"></button><h2 id="g-title"></h2><button class="ibtn" id="g-help" aria-label="Как играть"></button></header>
  <div class="stats">
    <div class="pill"><small>Очки</small><b id="st-score">0</b></div>
    <div class="pill turns"><small>Повороты</small><b id="st-turns">0</b></div>
    <div class="pill"><small id="st-l3">Вопросы</small><b id="st-3">0</b></div>
  </div>
  <div class="cube-slot"></div>
  <div class="foot" id="g-foot"></div>
</section>

<section id="scr-train" class="scr">
  <header class="bar"><button class="ibtn" id="tr-back" aria-label="Назад"></button><h2>Тренировка сборки</h2><span class="ibtn tr-step" id="tr-step"></span></header>
  <div class="tr-dots" id="tr-dots"></div>
  <div class="cube-slot"></div>
  <div class="foot" id="tr-foot"></div>
</section>

<section id="scr-ach" class="scr">
  <header class="bar"><button class="ibtn" data-go="menu" aria-label="В меню"></button><h2>Достижения</h2><span class="ibtn"></span></header>
  <div class="tabs" id="ach-tabs"></div>
  <div class="scroll" id="ach-body"></div>
</section>

<section id="scr-skins" class="scr">
  <header class="bar"><button class="ibtn" data-go="menu" aria-label="В меню"></button><h2>Достижения</h2><span class="ibtn"></span></header>
  <div class="tabs" id="sk-tabs"></div>
  <p class="lead sk-lead" id="sk-lead"></p>
  <div class="cube-slot"></div>
  <div class="sk-list" id="sk-list"></div>
</section>

<section id="scr-my" class="scr">
  <header class="bar"><button class="ibtn" id="my-back" aria-label="Назад"></button><h2>Мои вопросы</h2><span class="ibtn"></span></header>
  <div class="scroll">
    <p class="lead" id="my-lead"></p>
    <div id="my-list"></div>
  </div>
  <div class="foot">
    <button class="btn primary" id="my-add"></button>
    <div class="two-sm"><button class="btn ghost" id="my-save"></button><button class="btn ghost" id="my-load"></button></div>
    <input type="file" id="my-file" accept=".txt,.json,text/plain,application/json" hidden>
  </div>
</section>

<div id="sheet" class="overlay" hidden><div class="card qcard" id="qcard"></div></div>
<div id="edit" class="overlay top" hidden><div class="card" id="ecard"></div></div>
<div id="modal" class="overlay" hidden><div class="card" id="mcard"></div></div>
<div id="toast"></div>
<noscript><p style="padding:24px;color:#fff">Для игры нужен JavaScript.</p></noscript>
<script type="module" src="game.js?v=0.15.0"></script>
</body>
</html>
